name: Check Java explanations
on:
  push:
    paths:
      - 'data/guides/**'
      - 'scripts/check-guides.mjs'
      - '.github/workflows/guide-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run every published Java example
        run: node scripts/check-guides.mjs --java --complete
